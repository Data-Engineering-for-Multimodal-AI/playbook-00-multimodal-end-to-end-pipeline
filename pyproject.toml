[project]
name = "playbook-00-multimodal-end-to-end-pipeline"
version = "1.1.0"
description = "End-to-end multimodal pipeline on the Future Factories data: a local mode, and the Google Cloud version"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# The local pipeline (run_local.py, resolve/) and download_data.py
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "pillow>=11",
    "requests>=2.32",
    "kaggle>=1.7",
]

[project.optional-dependencies]
# The Google Cloud runner and deploy script at the repo root (same packages as requirements.txt).
# Each Cloud Run service has its own requirements.txt under services/.
cloud = [
    "httpx>=0.27.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-bigquery>=3.15.0",
    "tenacity>=8.2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
