# Rules for the Future Factories cell, on the signals the data has. The planner checks every fused
# reading against them; the safety check then validates each proposed action against the tool registry.
#
# Conditions: "<field> <op> <value>", joined with "and". Fields are sensor names from the data, plus:
#   max_vfd_temperature   hottest of the four conveyor drives (degrees C)
#   conveyor_moving       true when any conveyor speed is above 0
#   z.<sensor>            (value - historical mean) / historical std, from the 30-hour analog baselines
#
# Thresholds come from the data: the drives run at 85-93 C (analog dataset, 1st-99th percentile), so a
# fixed 85 C limit, as in the first edition, would stop the line most of the day.
version: "2.0"
name: "Future Factories cell safety policy"

rules:
  - name: door_open_while_moving
    condition: "I_SafetyDoor1_Status == false and conveyor_moving == true"
    action: emergency_stop
    parameters: {zone: cell, reason: "Safety door 1 open while the conveyor runs"}
  - name: door2_open_while_moving
    condition: "I_SafetyDoor2_Status == false and conveyor_moving == true"
    action: emergency_stop
    parameters: {zone: cell, reason: "Safety door 2 open while the conveyor runs"}
  - name: drive_overheating
    condition: "max_vfd_temperature > 100"
    action: reduce_speed
    parameters: {reduction_percent: 50, zone: conveyor}
  - name: drive_hotter_than_usual
    condition: "z.max_vfd_temperature > 3"
    action: alert_maintenance
    parameters: {priority: high, description: "A conveyor drive is more than 3 standard deviations hotter than usual"}
  - name: gripper_overload_r03
    condition: "z.I_R03_Gripper_Load > 6"
    action: alert_maintenance
    parameters: {priority: medium, description: "Robot 3 gripper load far above its usual range"}

# Applied by the safety check, after planning
constraints:
  min_seconds_between_same_action: 60   # one alert per zone and action per minute, not one per reading
